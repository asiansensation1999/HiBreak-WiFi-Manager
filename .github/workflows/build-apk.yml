name: Build HiBreak APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract app
        run: unzip -q HiBreak-WiFi-Manager-source.zip

      - name: Build APK
        run: gradle --no-daemon -p HiBreak-WiFi-Manager assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HiBreak-WiFi-APK
          path: HiBreak-WiFi-Manager/app/build/outputs/apk/debug/app-debug.apk
